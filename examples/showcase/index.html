  <head>
    <meta charset="UTF-8" />

      name="viewport"

    />
    <title>poopdeck.gl — navigation &amp; observation</title>
    <meta
      name="description"
      content="poopdeck.gl — time-aware deck.gl layers and a tile format for streaming animated geospatial data. Built for things that move: ships, drifters, cars, and anything with a trace."

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap"

    />
