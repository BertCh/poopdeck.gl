name: Release npm (@poopdeck.gl)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # push the Version Packages branch + tags
  pull-requests: write # open/update the Version Packages PR
  id-token: write # npm provenance / trusted publishing (public repo only)

concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # No version pin here — pnpm/action-setup reads packageManager from
      # package.json; a second pin can only drift.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build typecheck test --filter='./packages/*'
      # Publish-shape gate: real tarballs, real peers, every exports subpath.
      - name: smoke-pack (pre-publish gate)
        run: node scripts/smoke-pack.mjs
      # changesets/action v2 (needs Changesets CLI v3, which package.json pins):
      #   - inputs are kebab-case and the two scripts are `*-script`; the old
      #     names are a hard error, not a silent no-op.
      #   - the token comes from the `github-token` input, which defaults to
      #     the workflow token, and the action hands it to both scripts as
      #     GITHUB_TOKEN itself — @changesets/changelog-github still gets it.
      #   - the version branch and the release tags are pushed through the
      #     GitHub API, not `git push`.
      #   - which packages were released is read from the CLI's
      #     CHANGESETS_OUTPUT report, not parsed out of stdout. `pnpm run
      #     release` ends in `changeset tag`, which inherits that variable and
      #     writes one event per tag it creates; those are the tags pushed.
      #   - `push-git-tags: true` is a behaviour change, on purpose. Under v1,
      #     `createGithubReleases: false` also meant the tags `changeset tag`
      #     created on the runner were never pushed, and every release's
      #     `@poopdeck.gl/*@x.y.z` tags reached the remote by hand. v2 splits
      #     the two switches: tags yes, GitHub Releases no.
      - name: Version PR or publish
        uses: changesets/action@v2
        with:
          version-script: pnpm run version-packages
          publish-script: pnpm run release
          create-github-releases: false
          push-git-tags: true
        env:
          # Bootstrap auth: granular @poopdeck.gl token (secret NPM_TOKEN).
          # After the first publish, configure a Trusted Publisher on each
          # npm package (repo BertCh/spatiotemporal-tiles, workflow
          # release-npm.yml), then delete this secret — npm >= 11.5.1 will
          # mint OIDC tokens itself. Add NPM_CONFIG_PROVENANCE: 'true' once
          # the repository is public (provenance requires a public repo).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
