name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust:
    name: Rust (cargo test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --workspace
        run: cargo build --workspace --all-features
      - name: cargo test --workspace
        # stt-generate's satellites GMST test is flaky on CI; exclude until
        # it's stabilised. Everything else is part of the gate.
        run: cargo test --workspace --exclude stt-generate

  typescript:
    name: TypeScript (typecheck + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@poopdeck.gl/core' typecheck
      - run: pnpm --filter '@poopdeck.gl/layers' typecheck
      - run: pnpm --filter '@poopdeck.gl/maplibre' typecheck
      - run: pnpm --filter '@poopdeck.gl/core' test
      - run: pnpm --filter '@poopdeck.gl/layers' test
      - run: pnpm --filter '@poopdeck.gl/maplibre' test

  bench-regression:
    name: Bench (regression vs baseline)
    runs-on: ubuntu-latest
    needs: [rust, typescript]
    # Skipped automatically when no baseline file exists in the repo.
    if: hashFiles('tools/bench/baselines/*.json') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@poopdeck.gl/core' build
      - name: Run bench against committed fixture baseline
        # The 733 KB `earthquakes-ci.stt` fixture and its matching JSON
        # baseline are committed to the repo (see tools/bench/baselines/),
        # so the regression check is a pure local comparison with no
        # network or USGS dependency. Tolerance is 15% — generous enough
        # to absorb cold-start noise on shared CI runners while still
        # catching real perf cliffs.
        run: |
          node tools/bench/src/index.mjs \
            tools/bench/baselines/earthquakes-ci.stt \
            --check tools/bench/baselines/earthquakes-ci.json \
            --tolerance 0.15

  showcase-probe:
    name: Showcase (all demos load)
    runs-on: ubuntu-latest
    needs: [typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@poopdeck.gl/render-test' install-browser
      - name: Build packages
        run: pnpm build
      - name: Start showcase
        # The showcase needs sample .stt files in examples/showcase/public/data.
        # We don't ship those in CI yet, so this step is intentionally allowed
        # to fail silently — it will tighten once a small fixture set lands.
        run: |
          pnpm --filter '@poopdeck.gl/showcase' dev &
          for i in $(seq 1 30); do
            if curl -fs http://localhost:3000 >/dev/null; then break; fi
            sleep 1
          done
      - name: Probe all demos
        continue-on-error: true
        run: pnpm --filter '@poopdeck.gl/render-test' probe
