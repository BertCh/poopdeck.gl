name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust:
    name: Rust (cargo test, default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Default features = what `cargo install` users get.
      - name: cargo test --workspace
        run: cargo test --workspace --locked

  rust-all-features:
    name: Rust (cargo test, all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Everything at once: facade `cli` (all four bins, both serve
      # backends), `projection` (proj-sys vendors libproj via cmake), etc.
      # This is a TEST job — the old CI built --all-features but never ran
      # the feature-gated tests.
      - name: cargo test --workspace --all-features
        run: cargo test --workspace --all-features --locked

  rust-feature-lanes:
    name: Rust (feature lanes compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Each published feature combination must compile on its own —
      # feature-unification in the workspace jobs would otherwise hide
      # missing cfg gates until a user hits them.
      - name: facade serve-postgres only
        run: cargo check -p spatiotemporal-tiles --no-default-features --features serve-postgres --locked
      - name: facade serve-duckdb only
        run: cargo check -p spatiotemporal-tiles --no-default-features --features serve-duckdb --locked
      - name: facade full cli
        run: cargo check -p spatiotemporal-tiles --no-default-features --features cli --locked
      - name: stt-build without geoparquet
        run: cargo check -p stt-build --no-default-features --locked

  rust-package:
    name: Rust (cargo package dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Continuously verifies publishability: package excludes, versioned
      # path-deps, and manifest errors fail here instead of at release time.
      # stt-generate is publish = false and explicitly excluded.
      - name: cargo package --workspace
        run: cargo package --workspace --exclude stt-generate --locked

  rust-msrv:
    name: Rust (MSRV check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with [workspace.package] rust-version in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: cargo check --workspace on MSRV
        run: cargo check --workspace --locked

  rust-duckdb:
    name: Rust (stt-build, duckdb feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Bundled libduckdb is a ~10 min cold compile; rust-cache keeps the
      # warm path fast.
      - name: cargo test -p stt-build --features duckdb
        run: cargo test -p stt-build --features duckdb

  rust-postgres-parity:
    name: Rust (PostGIS source parity)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STT_TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/stt_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--test source_parity -- --ignored` runs exactly the #[ignore]d
      # postgres parity tests (they are the only ignored tests in that
      # binary) without sweeping up ignored tests elsewhere.
      - name: postgres source parity
        run: cargo test -p stt-build --features postgres --test source_parity -- --ignored

  python:
    name: Python (data-generation tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/data-generation/requirements-ci.txt
      - run: pip install -r scripts/data-generation/requirements-ci.txt
      - name: AV palette parity (Python ⇄ TS)
        run: python test_av_palette_parity.py
        working-directory: scripts/data-generation
      - name: av_common worldbuild + tracks
        run: python test_av_common_world_tracks.py
        working-directory: scripts/data-generation
      - name: av_common LOD home-zoom
        run: python test_lod_home_zoom.py
        working-directory: scripts/data-generation

  typescript:
    name: TypeScript (typecheck + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
      - run: pnpm --filter '@poopdeck.gl/core' typecheck
      - run: pnpm --filter '@poopdeck.gl/layers' typecheck
      - run: pnpm --filter '@poopdeck.gl/maplibre' typecheck
      - run: pnpm --filter '@poopdeck.gl/playback' typecheck
      - run: pnpm --filter '@poopdeck.gl/react' typecheck
      - run: pnpm --filter '@poopdeck.gl/three' typecheck
      - run: pnpm --filter '@poopdeck.gl/cesium' typecheck
      - run: pnpm --filter '@poopdeck.gl/core' test
      - run: pnpm --filter '@poopdeck.gl/layers' test
      - run: pnpm --filter '@poopdeck.gl/maplibre' test
      - run: pnpm --filter '@poopdeck.gl/playback' test
      - run: pnpm --filter '@poopdeck.gl/react' test
      - run: pnpm --filter '@poopdeck.gl/three' test
      - run: pnpm --filter '@poopdeck.gl/cesium' test
      - run: pnpm --filter '@poopdeck.gl/showcase' test
      # Publish-shape gate: pack every tarball, scratch-install with real
      # peers, import every exports subpath under plain Node, and prove the
      # react barrel works without the optional @deck.gl peers.
      - name: smoke-pack (tarball import matrix)
        run: node scripts/smoke-pack.mjs

  bench-regression:
    name: Bench (regression vs baseline)
    runs-on: ubuntu-latest
    needs: [rust, typescript]
    # NOTE: no job-level hashFiles() guard — hashFiles is step-context-only,
    # and using it in jobs.<id>.if makes GitHub reject the ENTIRE workflow at
    # parse time (every run "fails" with zero jobs). The baseline JSON is
    # committed (tools/bench/baselines/earthquakes-ci.json), so the job just
    # runs; if the baseline is ever removed, delete this job with it.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@poopdeck.gl/core' build
      - name: Run bench against committed fixture baseline
        # The 733 KB `earthquakes-ci.stt` fixture and its matching JSON
        # baseline are committed to the repo (see tools/bench/baselines/),
        # so the regression check is a pure local comparison with no
        # network or USGS dependency. Tolerance is 15% — generous enough
        # to absorb cold-start noise on shared CI runners while still
        # catching real perf cliffs.
        run: |
          node tools/bench/src/index.mjs \
            tools/bench/baselines/earthquakes-ci.stt \
            --check tools/bench/baselines/earthquakes-ci.json \
            --tolerance 0.15

  showcase-probe:
    name: Showcase (all demos load)
    runs-on: ubuntu-latest
    needs: [typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@poopdeck.gl/render-test' install-browser
      - name: Build packages
        run: pnpm build
      - name: Start showcase
        run: |
          pnpm --filter '@poopdeck.gl/showcase' dev &
          for i in $(seq 1 60); do
            if curl -fs http://localhost:3000 >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "showcase dev server never came up on :3000" >&2
          exit 1
      - name: Probe all demos
        run: pnpm --filter '@poopdeck.gl/render-test' probe
