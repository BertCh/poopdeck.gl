name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust:
    name: Rust (cargo test, default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Default features = what `cargo install` users get.
      - name: cargo test --workspace
        run: cargo test --workspace --locked

  rust-all-features:
    name: Rust (cargo test, all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Everything at once: facade `cli` (all five bins, both serve
      # backends), `projection` (proj-sys vendors libproj via cmake), etc.
      # This is a TEST job — the old CI built --all-features but never ran
      # the feature-gated tests.
      - name: cargo test --workspace --all-features
        run: cargo test --workspace --all-features --locked
        env:
          # The all-features link jobs (bundled DuckDB C++ + vendored libproj
          # + arrow, several test binaries linking concurrently) OOM the 7 GB
          # runner's linker under full debuginfo — ld dies with SIGBUS
          # ("signal 7, core dumped"). Debuginfo is useless in CI; dropping
          # it shrinks the link inputs by an order of magnitude.
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'

  rust-lint:
    name: Rust (rustfmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain action installs the minimal profile, which ships neither
      # rustfmt nor clippy — without this the steps below fail on a missing
      # component rather than on a real finding.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Baseline drift: rustfmt is the only formatting convention the workspace
      # has, and a hand-formatted patch turns every later diff over the same
      # lines into review noise that hides the real change.
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      # Correctness-flavoured lints ONLY, and the list is exactly what the
      # workspace satisfies in full: every hit is therefore a fresh regression,
      # never a pre-existing backlog entry. `-D warnings` is not usable here —
      # the workspace still carries dozens of style, complexity and perf
      # warnings, so it would fail on the first run and gate nothing. Widening
      # the list requires first driving that lint's count to zero; plain
      # `cargo clippy --workspace --all-targets` prints the standing backlog.
      # `clippy::float_cmp` is deliberately absent: exact float comparison is
      # intended here (integrality probes, encode/decode roundtrip assertions).
      # Default features, matching the `rust` job — linting the duckdb, postgres
      # and projection paths costs a bundled C++ and libproj build, and
      # rust-all-features already compiles them.
      - name: cargo clippy (curated deny set)
        run: |
          cargo clippy --workspace --all-targets --locked -- \
            -D clippy::correctness \
            -D clippy::suspicious \
            -D clippy::cast_ptr_alignment \
            -D clippy::index_refutable_slice \
            -D clippy::invalid_upcast_comparisons \
            -D clippy::mem_forget \
            -D clippy::debug_assert_with_mut_call \
            -D clippy::path_buf_push_overwrite \
            -D clippy::transmute_ptr_to_ptr \
            -D clippy::undocumented_unsafe_blocks \
            -D clippy::lossy_float_literal \
            -D clippy::dbg_macro \
            -D clippy::todo \
            -D clippy::unimplemented

  rust-feature-lanes:
    name: Rust (feature lanes compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Each published feature combination must compile on its own —
      # feature-unification in the workspace jobs would otherwise hide
      # missing cfg gates until a user hits them.
      - name: facade lib only (no features)
        run: cargo check -p spatiotemporal-tiles --no-default-features --locked
      - name: facade bare serve (both backends)
        run: cargo check -p spatiotemporal-tiles --no-default-features --features serve --bins --locked
      - name: facade serve-postgres only
        run: cargo check -p spatiotemporal-tiles --no-default-features --features serve-postgres --bins --locked
      - name: facade serve-duckdb only
        run: cargo check -p spatiotemporal-tiles --no-default-features --features serve-duckdb --bins --locked
      - name: facade full cli
        run: cargo check -p spatiotemporal-tiles --no-default-features --features cli --bins --locked
      - name: stt-build without geoparquet
        run: cargo check -p stt-build --no-default-features --locked

  rust-package:
    name: Rust (cargo package dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Continuously verifies publishability: package excludes, versioned
      # path-deps, and manifest errors fail here instead of at release time.
      # `--exclude stt-generate` is belt-and-braces — the generator moved out
      # to its own workspace at tools/, and cargo only warns about excluding a
      # non-member, so this keeps working if it ever moves back.
      - name: cargo package --workspace
        run: cargo package --workspace --exclude stt-generate --locked

  rust-msrv:
    name: Rust (MSRV check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with [workspace.package] rust-version in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2
      # The MSRV is a promise to `cargo install` users, so it covers exactly
      # the crates they can install — naming them beats `--workspace`, which
      # dragged in the unpublished stt-generate (osmpbf/home/delaunator) and
      # let a generator-only dep raise the number users see. Naming packages
      # also keeps this job correct whether stt-generate is still a workspace
      # member or has moved out to tools/.
      - name: cargo check on MSRV (published crates)
        run: cargo check -p stt-core -p stt-build -p stt-optimize -p spatiotemporal-tiles --locked

  rust-duckdb:
    name: Rust (stt-build, duckdb feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `INSTALL spatial` downloads the extension into ~/.duckdb on first use.
      # Cache it so the ignored spatial test below neither re-downloads on
      # every run nor goes red when the extension host has a bad day. Keyed on
      # Cargo.lock — the duckdb crate version is what pins the extension
      # version the download resolves to.
      - name: Cache DuckDB extensions
        uses: actions/cache@v4
        with:
          path: ~/.duckdb
          key: duckdb-ext-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: duckdb-ext-${{ runner.os }}-
      # Bundled libduckdb is a ~10 min cold compile; rust-cache keeps the
      # warm path fast.
      - name: cargo test -p stt-build --features duckdb
        run: cargo test -p stt-build --features duckdb
      # spatial_roundtrip_smoke is the only test that runs the SQL the server
      # actually emits (ST_Point / ST_AsWKB / ST_MakeEnvelope /
      # ST_Intersects_Extent / ST_Transform). It is #[ignore]d because the
      # first INSTALL needs network, so a plain `cargo test` skips it and that
      # SQL ships unexercised — this step is the whole reason the job is more
      # than a compile check. `--lib` scopes --include-ignored to the lib test
      # binary, keeping the server-gated ignored tests in tests/ out of it.
      - name: duckdb spatial SQL (ignored test)
        run: cargo test -p stt-build --features duckdb --lib -- --include-ignored

  rust-postgres-parity:
    name: Rust (PostGIS source parity)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STT_TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/stt_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--test source_parity -- --ignored` runs exactly the #[ignore]d
      # postgres parity tests (they are the only ignored tests in that
      # binary) without sweeping up ignored tests elsewhere.
      - name: postgres source parity
        run: cargo test -p stt-build --features postgres --test source_parity -- --ignored

  python:
    name: Python (data-generation tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/data-generation/requirements-ci.txt
      - run: pip install -r scripts/data-generation/requirements-ci.txt
      - name: AV palette parity (Python ⇄ TS)
        run: python test_av_palette_parity.py
        working-directory: scripts/data-generation
      - name: av_common worldbuild + tracks
        run: python test_av_common_world_tracks.py
        working-directory: scripts/data-generation
      - name: av_common LOD home-zoom
        run: python test_lod_home_zoom.py
        working-directory: scripts/data-generation

  typescript-lint:
    name: TypeScript (oxlint + oxfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Correctness class, not taste: .oxlintrc.json enables the correctness
      # category as errors and nothing else, so a hit is a dead binding, an
      # unreachable branch, a misused hook or a broken import — plus the five
      # jsx-a11y rules the config promotes, which catch handlers no keyboard can
      # reach. Both steps are source-only with no build, so this is its own job
      # rather than a tail step on `typescript`: the answer arrives in seconds
      # instead of behind eight typechecks and nine vitest suites.
      - name: oxlint
        run: pnpm lint
      # Baseline drift across everything tracked, docs included — oxfmt formats
      # markdown too, so a hand-realigned table fails here instead of landing as
      # churn on top of the next person's diff.
      - name: oxfmt --check
        run: pnpm format:check

  typescript:
    name: TypeScript (typecheck + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The golden-pin gate below diffs against a merge-base, which the
          # default depth-1 checkout cannot compute. It fails closed rather
          # than checking nothing, so full history is not optional here.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      # Version gate: the cargo workspace version and the Claude Code plugin
      # surface (plugin.json, the marketplace entry, every skill's
      # `metadata.version`) are outside the changesets fixed group, so nothing
      # bumps them automatically — that is how npm reached 0.5.0 while
      # crates.io sat at 0.4.0. Pure fs + JSON, no install or build needed —
      # run it first so drift fails in seconds instead of after the whole build.
      - name: cargo/plugin/skill versions in sync
        run: node scripts/sync-versions.mjs --check
      - name: project status matches manifests and format constants
        run: node scripts/check-project-status.mjs
      - name: documentation links resolve
        run: node scripts/check-doc-links.mjs
      # Doc-drift gate: source comments cite docs/roadmap/*.md by name, and the
      # last roadmap consolidation stranded 39 of them. git grep + existsSync,
      # ~50 ms.
      - name: roadmap citations resolve
        run: node .github/scripts/check-roadmap-citations.mjs
      # Golden-pin gate: the v2 byte fixtures are the encoder's determinism
      # oracle, and the two times they moved, each move cost a full fleet
      # re-upload (29.3 GiB / 1,324 objects in 2026-07-26). Moving them is a
      # reviewed decision, declared with a `Rebuild-Window: R1` commit trailer;
      # anything else is an encoder bug wearing a re-blessed fixture. Pure git,
      # no install or build needed, so it runs in the fast pre-build block.
      - name: golden byte pins only move inside rebuild window R1
        run: node .github/scripts/check-golden-pins.mjs
      # The gate's own tests, in the same block: a gate nobody tests rots into
      # a green light. node:test, no dependencies, well under a second.
      - name: golden-pin gate self-test
        run: node --test .github/scripts/check-golden-pins.test.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
      # Generated-doc gate: re-renders docs/spec/backend-capabilities.md from
      # the four BackendDescriptors and byte-compares it with the committed
      # file, so a descriptor edit without a regeneration fails here instead of
      # rotting the doc. Must run AFTER the build — it imports packages/*/dist.
      - name: backend-capabilities doc in sync
        run: node scripts/gen-capabilities-doc.mjs --check
      # Copy-paste gate: the quickstart's React samples are the first code a
      # newcomer runs, and two of them did not compile under strict TS while
      # every package typechecked clean — the samples live in Markdown, which
      # nothing here compiled. Extracts every standalone ```ts/```tsx block from
      # the onboarding docs and typechecks them against the showcase's real
      # dependency versions. AFTER the build: the snippets import package entry
      # points, which resolve to dist.
      - name: onboarding doc samples typecheck
        run: node scripts/check-doc-snippets.mjs
      - run: pnpm --filter '@poopdeck.gl/core' typecheck
      - run: pnpm --filter '@poopdeck.gl/layers' typecheck
      - run: pnpm --filter '@poopdeck.gl/maplibre' typecheck
      - run: pnpm --filter '@poopdeck.gl/mcp' typecheck
      - run: pnpm --filter '@poopdeck.gl/playback' typecheck
      - run: pnpm --filter '@poopdeck.gl/react' typecheck
      - run: pnpm --filter '@poopdeck.gl/three' typecheck
      - run: pnpm --filter '@poopdeck.gl/cesium' typecheck
      - run: pnpm --filter '@poopdeck.gl/core' test
      - run: pnpm --filter '@poopdeck.gl/layers' test
      - run: pnpm --filter '@poopdeck.gl/maplibre' test
      - run: pnpm --filter '@poopdeck.gl/mcp' test
      - run: pnpm --filter '@poopdeck.gl/playback' test
      - run: pnpm --filter '@poopdeck.gl/react' test
      - run: pnpm --filter '@poopdeck.gl/three' test
      - run: pnpm --filter '@poopdeck.gl/cesium' test
      - run: pnpm --filter '@poopdeck.gl/showcase' test
      # The measurement harness's own tests. `tools/bench` is a workspace
      # package (pnpm-workspace.yaml globs `tools/*`) but had never appeared in
      # a filter line here, so the trace replayer's determinism and
      # conservation-invariant tests — including the guard that request count is
      # never a ranking key on its own — ran only when someone remembered to.
      # No build needed: the replayer imports `@poopdeck.gl/core` lazily and
      # only when `--archive` is passed, and these tests replay the committed
      # micro-trace fixture instead.
      - run: pnpm --filter '@poopdeck.gl/bench' test
      # Publish-shape gate: pack every tarball, scratch-install with real
      # peers, import every exports subpath under plain Node, prove the react
      # barrel works without the optional @deck.gl peers, and check that the
      # mcp tarball carries an executable stt-mcp bin plus its bundled docs.
      - name: smoke-pack (tarball import matrix)
        run: node scripts/smoke-pack.mjs

  # ── RETIRED 2026-08-10: `bench-regression` ────────────────────────────────
  #
  # It ran `tools/bench/src/index.mjs` against `earthquakes-ci.stt` with
  # `--tolerance 0.15`. It could not have passed since the single-file archive
  # container was removed, and nobody saw that because of backlog T2 (GitHub
  # Actions has never executed in this repo, so every job here is enforced by
  # local discipline). Verbatim, on 2026-08-10:
  #
  #     Error: STT manifest: invalid JSON
  #            (Unexpected token 'S', "STTqZ*"... is not valid JSON)
  #
  # TWO independent breakages, both fatal:
  #
  #   1. The fixture. `earthquakes-ci.stt` began `53 54 54 04` — the retired
  #      single-file v4 container. No reader in this repo opens that shape any
  #      more (`ArchiveWriter`/`ArchiveReader` survive only in prose), so
  #      `STTArchive` treated the container as a packed `manifest.json` and
  #      JSON-parsed its header. Not a symptom of the in-flight v2→v3 bump —
  #      it fails before the version gate.
  #   2. The harness. `bench.mjs`'s `createFileFetch` serves every Range out of
  #      ONE in-memory buffer, so a packed archive (manifest.json + index/ +
  #      packs/) cannot be replayed through it either — pointing it at a real
  #      packed manifest gets you `STT directory truncated: got 5024 bytes,
  #      expected 156`. Re-cutting the fixture alone would NOT have revived
  #      this job.
  #
  # Retired rather than repaired because a gate that cannot run is worse than
  # an absent one: it launders confidence. Reviving it needs (a) a URL-aware
  # local fetch in `tools/bench/src/bench.mjs` and (b) a packed fixture minted
  # AFTER the in-flight v2→v3 format break settles — anything minted now is
  # formatVersion 3 and unreadable by a HEAD checkout. Full finding, with the
  # restoration recipe: docs/roadmap/measurements-2026-08.md §8.6.
  #
  # `tools/bench`'s own tests now run in the `typescript` job above, which is
  # real coverage of the harness in place of a check that never executed.
  # ───────────────────────────────────────────────────────────────────────────

  showcase-probe:
    name: Showcase (all demos load)
    runs-on: ubuntu-latest
    needs: [typescript]
    env:
      # The probe loads REAL archives, and every dataset path is resolved
      # against VITE_DATA_BASE_URL (src/datasets.ts). That variable lives in
      # examples/showcase/.env.production, which Vite reads in production mode
      # only — the dev server below never sees it. Without this line every
      # dataset resolves to /data/*.stt, i.e. the gitignored
      # examples/showcase/public/data (zero tracked files), every archive
      # fetch 404s, and the fail-closed probe CANNOT pass. Vite picks
      # VITE_-prefixed process env up in any mode. Keep in step with
      # .env.production.
      VITE_DATA_BASE_URL: https://tiles.poopdeck.gl
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # --with-deps: the runner image does not carry chromium's shared libs.
      - name: Install chromium
        run: pnpm --filter '@poopdeck.gl/render-test' exec playwright install --with-deps chromium
      # Only the packages: the dev server below reads the showcase from source,
      # and its own build (uncached, tsc + prerender of every route) is already
      # covered by the typescript job.
      - name: Build packages
        run: pnpm turbo run build --filter='./packages/*'
      # Dev server, not the built site, on purpose: `/demo/:datasetId` is not
      # in react-router's prerender list, and the SPA fallback the build emits
      # (`__spa-fallback.html`) is only wired up by the deploy's worker — a
      # plain `vite preview` answers /demo/* with the prerendered `/` HTML, so
      # every demo hydrates with a React #418 mismatch. The dev server serves
      # the real shell for every route.
      - name: Start showcase
        run: |
          pnpm --filter '@poopdeck.gl/showcase' dev &
          # Poll a demo route rather than `/` — it proves the router is
          # serving, not just that a socket is open.
          for i in $(seq 1 90); do
            if curl -fs http://localhost:3000/demo/earthquake-activity >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "showcase dev server never came up on :3000" >&2
          exit 1
      - name: Probe all demos
        run: pnpm --filter '@poopdeck.gl/render-test' probe
